<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup message</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <button type="submit" id="login" onclick="openpopUp()">Login</button>

    <div class="popup" id="message">
        <img src="./404-tick.png" alt="">
        <h1>Thank You!</h1>
        <p>Your details has been successfully submitted. Thanks!</p>
        <button class="ok" onclick="closePopup()">Ok</button>
    </div>
</div>

    <script src="main.js"></script>
</body>
</html>
