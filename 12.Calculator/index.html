<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="calculator">
      <input type="text" readonly id="display" />
      <div id="keys">
        <button onclick="buttonsClick('+')" class="operator-btn">+</button>
        <button onclick="buttonsClick('7')">7</button>
        <button onclick="buttonsClick('8')">8</button>
        <button onclick="buttonsClick('9')">9</button>
        <button onclick="buttonsClick('-')" class="operator-btn">-</button>
        <button onclick="buttonsClick('4')">4</button>
        <button onclick="buttonsClick('5')">5</button>
        <button onclick="buttonsClick('6')">6</button>
        <button onclick="buttonsClick('*')" class="operator-btn">*</button>
        <button onclick="buttonsClick('1')">1</button>
        <button onclick="buttonsClick('2')">2</button>
        <button onclick="buttonsClick('3')">3</button>
        <button onclick="buttonsClick('/')" class="operator-btn">/</button>
        <button onclick="buttonsClick('0')">0</button>
        <button onclick="buttonsClick('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="clearDisplay()" class="operator-btn">C</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
