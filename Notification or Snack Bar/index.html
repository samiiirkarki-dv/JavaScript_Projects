<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification or Snack Bar</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <div class="buttons">
      <button onclick="showToast('Successfully submitted')">Success</button>
      <button onclick="showToast('Please fix the error!')">Error</button>
      <button onclick="showToast('Invalid input, check again')">Invalid</button>
    </div>

    <div id="toast-box"></div>

    <script src="main.js"></script>
  </body>
</html>
